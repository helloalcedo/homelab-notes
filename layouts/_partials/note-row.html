{{- $number := partial "record-number.html" .page -}}
<a class="note-row" href="{{ .page.RelPermalink }}"><span class="row-index">{{ printf "%02d" $number }}</span><div class="note-copy"><span class="note-category">{{ .page.Params.category | default "Notes" }}</span><h3 style="view-transition-name:{{ partial "transition-name.html" .page }}">{{ .page.Title }}</h3><p>{{ .page.Params.summary }}</p></div><time datetime="{{ .page.Date.Format "2006-01-02" }}">{{ .page.Date.Format "2006.01.02" }}</time>{{ partial "arrow.html" . }}</a>
