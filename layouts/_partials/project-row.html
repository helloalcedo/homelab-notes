{{- $number := partial "record-number.html" .page -}}
<a class="project-row" href="{{ .page.RelPermalink }}">
  <span class="row-index">{{ printf "%02d" $number }}</span>
  <div class="row-copy"><h3 style="view-transition-name:{{ partial "transition-name.html" .page }}">{{ .page.Title }}</h3><p>{{ .page.Params.summary }}</p></div>
  <div class="stack">{{ range first 3 .page.Params.stack }}<span>{{ . }}</span>{{ end }}</div>
  {{ partial "arrow.html" . }}
</a>
